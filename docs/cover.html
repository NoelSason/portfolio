<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<!-- Renders docs/screenshots/cover.png (1200x675) for the Builder Center entry.
     Serve the repo root (python3 -m http.server) and screenshot /docs/cover.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 675px; background: #0f1a2b; overflow: hidden; }
  svg { display: block; }
  .call { font-family: "Atkinson Hyperlegible Mono", monospace; font-size: 15px; font-weight: 600; text-anchor: middle; }
  .peaks { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
  .A { fill: #4cc774; stroke: #4cc774; }
  .C { fill: #7aa5ff; stroke: #7aa5ff; }
  .G { fill: #f0a848; stroke: #f0a848; }
  .T { fill: #ff7083; stroke: #ff7083; }
  .peaks.A, .peaks.C, .peaks.G, .peaks.T { fill: none; }
  .call.A, .call.C, .call.G, .call.T { stroke: none; }
  .axis { stroke: #2a3b55; stroke-width: 1.5; }
  .aa { font-family: "Atkinson Hyperlegible Mono", monospace; font-size: 22px; font-weight: 600; text-anchor: middle; fill: #0f1a2b; }
  .bead { fill: #e7eef6; }
  .bead.special { fill: #4cc774; }
  .bond { stroke: #e7eef6; stroke-width: 3; }
</style>
</head>
<body>
<svg id="cover" width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
  import { GENE, GENE_MESSAGE } from "../site/js/genetics.js";

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("cover");
  const el = (name, attrs) => {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    svg.append(node);
    return node;
  };

  // Same seeded generator and peak model as site/js/main.js, scaled up.
  let seed = 2028;
  const random = () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const width = 1200, spacing = 26, left = (width - spacing * (GENE.length - 1)) / 2;
  const baseline = 420, peakHeight = 250, sigma = 5.6;
  const peaks = { A: [], C: [], G: [], T: [] };
  [...GENE].forEach((call, i) => {
    const x = left + i * spacing;
    for (const b of "ACGT") {
      if (b === call) peaks[b].push({ x: x + (random() - 0.5) * 2, h: 0.55 + random() * 0.45 });
      else if (random() < 0.45) peaks[b].push({ x: x + (random() - 0.5) * 10, h: random() * 0.11 });
    }
  });
  for (const b of "ACGT") {
    let d = "";
    for (let x = 0; x <= width; x += 1) {
      let y = 0;
      for (const p of peaks[b]) y += p.h * Math.exp(-((x - p.x) ** 2) / (2 * sigma * sigma));
      d += `${x === 0 ? "M" : "L"}${x} ${(baseline - y * peakHeight).toFixed(1)}`;
    }
    el("path", { d, class: `peaks ${b}` });
  }
  el("line", { x1: 0, x2: width, y1: baseline + 1, y2: baseline + 1, class: "axis" });
  [...GENE].forEach((call, i) => {
    el("text", { x: left + i * spacing, y: 138, class: `call ${call}` }).textContent = call;
  });

  // The protein the gene spells, as a chain of beads under the trace.
  const n = GENE_MESSAGE.length, gap = 64, r = 22;
  const x0 = (width - gap * (n - 1)) / 2, y = 530;
  el("line", { x1: x0, x2: x0 + gap * (n - 1), y1: y, y2: y, class: "bond" });
  [...GENE_MESSAGE].forEach((aa, i) => {
    el("circle", { cx: x0 + i * gap, cy: y, r, class: `bead${aa === "O" ? " special" : ""}` });
    el("text", { x: x0 + i * gap, y: y + 8, class: "aa" }).textContent = aa;
  });
</script>
</body>
</html>
